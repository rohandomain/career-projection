<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPath Insider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>CareerPath Insider</h1>
            <p>Discover your earning potential and future.</p>
        </header>

        <section class="controls">
            <div class="input-group">
                <label for="degreeSelect">Do you have a degree?</label>
                <select id="degreeSelect">
                    <option value="degree">Yes, I have a degree</option>
                    <option value="nodegree">No degree / Self-taught</option>
                </select>
            </div>

            <div class="input-group">
                <label for="fieldSelect">Select a Field</label>
                <select id="fieldSelect">
                    <option value="tech">Technology & Coding</option>
                    <option value="finance">Finance & Business</option>
                    <option value="health">Healthcare</option>
                    <option value="trades">Skilled Trades</option>
                </select>
            </div>

            <button onclick="getCareerInsights()">Get Insights</button>
        </section>

        <section id="resultSection" class="hidden">
            <h2 id="roleTitle">Career Title</h2>
            
            <div class="stats-grid">
                <div class="card">
                    <h3>Average Salary</h3>
                    <p id="avgSalary">-</p>
                </div>
                <div class="card">
                    <h3>Top Earner (90%)</h3>
                    <p id="highSalary">-</p>
                </div>
                <div class="card">
                    <h3>Growth (10yr)</h3>
                    <p id="growthRate">-</p>
                </div>
            </div>

            <div class="details-card">
                <h3>Required Skills</h3>
                <ul id="skillsList">
                    </ul>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
