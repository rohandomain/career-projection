<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career & Economics Insights</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<!-- External CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Career & Economics Insights</h1>
    <p class="lead">Explore careers, salary projections, and economic trends interactively. See how choices can impact financial outcomes.</p>

    <!-- Simulated Impact Metrics -->
    <div class="metrics">
        <div class="metric-card">
            <h2 id="totalUsers">152</h2>
            <p>Total Users</p>
        </div>
        <div class="metric-card">
            <h2 id="careersProjected">324</h2>
            <p>Careers Projected</p>
        </div>
        <div class="metric-card">
            <h2 id="topCareer">Software Engineer</h2>
            <p>Most Popular Career</p>
        </div>
    </div>

    <!-- Interactive Career Projection -->
    <div class="card">
        <input type="text" id="career" placeholder="Career (e.g., Software Engineer)">
        <input type="number" id="years" placeholder="Years of experience">
        <input type="text" id="location" placeholder="Location (e.g., New York)">
        <button id="projectBtn">Show Projection</button>
        <div class="result" id="output"></div>
    </div>
</div>

<!-- External JS -->
<script src="script.js"></script>
</body>
</html>
